name: embed-docs
on:
  push:
    branches: [library-update-run]
    paths: [tools/embed_now.txt]
permissions:
  contents: write
jobs:
  embed:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: node tools/embed_docs.mjs
        env:
          VOYAGE_API_KEY: ${{ secrets.VOYAGE_API_KEY }}
      - run: |
          git config user.name "embed-docs" && git config user.email "actions@users.noreply.github.com"
          git add app/lib/doc_vectors.json && git commit -m "Story and song vectors [skip ci]" && git push
