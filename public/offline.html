<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Phoenix — offline</title>
<style>
:root{--bg:#FBF8F4;--text:#1A1A1A;--muted:#55534E;--accent:#B8410E}
@media (prefers-color-scheme:dark){:root{--bg:#140C09;--text:#F5EDE6;--muted:#C4B3A8;--accent:#F3701E}}
body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;background:var(--bg);color:var(--text);font-family:Georgia,serif;text-align:center;padding:24px}
img{width:96px;height:96px}h1{font-weight:400;font-size:28px;margin:16px 0 8px}p{color:var(--muted);font-family:system-ui,sans-serif;line-height:1.5;margin:0 0 20px}
button{font:600 15px system-ui,sans-serif;background:var(--accent);color:#fff;border:0;border-radius:12px;padding:12px 20px;cursor:pointer}
</style></head>
<body><main><img src="/icon-192.png" alt=""><h1>You’re offline</h1><p>Phoenix needs an internet connection to search the Writings.<br>Check your connection and try again.</p><button onclick="location.reload()">Try again</button></main></body></html>
